<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>헤헿 내 사이트</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/favicon.png" type="image/png">
    <style>
    @font-face {
      font-family: 'RXFont';
      src: url('font/font.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    body {
      font-family: 'RXfont';
      text-align: center;
    }
    q {
      quotes: "“" "”" "‘" "’";
    }
    </style>
  </head>
  <body>
    <h1>가장 큰 제목</h1>
    <h2>두번째로 큰 제목</h2>
    <h3>세번째로 큰 제목</h3>
    <h4>뒤에서 세번째로 큰 제목</h4>
    <h5>뒤에서 두번째로 큰 제목</h5>
    <h6>가장 작은 제목</h6>
    <p>문단</p>
    줄바꿈을<br>사용해봤다.
    <hr>
    선
    <p><storng>강조!</storng></p>
    <p><b>강조bold</b></p>
    <p><em>기울임</em></p>
    <p><i>이탤릭</i></p>
    <p><mark>하이라이트</mark></p>
    <p>그가 말했다<q>안녕하세요!</q></p>
    <blockquote>혁신은 리더와 추종자를 구분시킨다.</blockquote>
    <p>-스티브 잡스</p>
    <p>이 글자만 <span style="color:red">빨간 글씨</span>임</p>
    <div style="background-color:yellow; padding:10px; margin:10px">
      <h2>div 사용해보겠다</h2>
      <p>와우</p>
    </div>
    <div style="width:50%; background-color:lightgreen; margin:10px auto; padding:5px">
      <h2>가운데 정렬된 div</h2>
      <p>가운데 정렬이 된 박스를 만들어 봤다</p>
      <p>그리고 가로 길이도 50%임ㅎ</p>
    </div>
  </body>
</html>
